<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blits logo</title>
<link rel="icon" href="./out/favicon.ico">
<script type="module" src="./blits-logo.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d17; color: #cfd6c4; font: 13px/1.4 -apple-system, Helvetica, sans-serif; }
  main { height: 100%; overflow: auto; box-sizing: border-box; padding: 24px; display: grid; gap: 18px; align-content: start; }
  h2 { margin: 12px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #8c957f; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  figure { margin: 0; display: grid; gap: 6px; }
  figcaption { font: 11px/1.3 Menlo, monospace; color: #8c957f; }
  blits-logo { width: 100%; }
  .light { background: #f4f6ef; padding: 18px; border-radius: 6px; }
  .marks { display: flex; gap: 14px; align-items: end; }
  .marks blits-logo.m96 { width: 96px; } .marks blits-logo.m48 { width: 48px; } .marks blits-logo.m24 { width: 24px; }
  button { justify-self: start; font: inherit; background: #2a3022; color: #eef3e4; border: 0; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
</style>
<main>
  <h2>Effects</h2>
  <div class="grid" id="effects"></div>
  <button id="replay">Replay all</button>
  <h2>Options</h2>
  <div class="grid">
    <figure><blits-logo effect="none"></blits-logo><figcaption>effect="none"</figcaption></figure>
    <figure><blits-logo effect="sweep" field></blits-logo><figcaption>field</figcaption></figure>
    <figure><blits-logo effect="twinkle" glow></blits-logo><figcaption>glow</figcaption></figure>
    <figure><div class="light"><blits-logo effect="sweep" color="#111"></blits-logo></div><figcaption>color="#111" on light</figcaption></figure>
  </div>
  <h2>Mark</h2>
  <div class="marks">
    <blits-logo class="m96" variant="mark" panel glow effect="boot"></blits-logo>
    <blits-logo class="m48" variant="mark" panel effect="pulse"></blits-logo>
    <blits-logo class="m24" variant="mark" panel effect="none"></blits-logo>
  </div>
</main>
<script type="module">
  const effects = ['boot', 'sweep', 'twinkle', 'pulse', 'chase'];
  document.getElementById('effects').innerHTML = effects.map(e =>
    `<figure><blits-logo effect="${e}" panel glow field></blits-logo><figcaption>effect="${e}" panel glow field</figcaption></figure>`).join('');
  document.getElementById('replay').onclick = () => document.querySelectorAll('blits-logo').forEach(l => l.play());
</script>
