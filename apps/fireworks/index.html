<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blits fireworks</title>
  </head>
  <body>
    <main id="root">
      <div class="sky">
        <canvas id="sky"></canvas>
        <button id="start" class="start" type="button">Start the show</button>
      </div>
      <div class="controls">
        <button id="launch" type="button" disabled>Launch</button>
        <label><input id="auto" type="checkbox" checked /> keep launching</label>
        <label class="speed">speed <input id="rate" type="range" min="0.1" max="2" step="0.05" value="1" /></label>
        <output id="rate-out" class="readout">1.00×</output>
      </div>
      <p class="caption">
        One blits mix plays every shell. A quarks driver turns each shell's pose into sparks, and a
        Tone driver turns the same pose into its whistle and books each bang on the audio clock.
        Click the sky to aim one.
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
