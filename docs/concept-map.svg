<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 968" width="1240" height="968" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', sans-serif">
<style>
  :root {
    --bg: #fbfaf7; --ink: #1c1b1f; --muted: #6d6b73; --line: #cbc8c0;
    --panel: #ffffff; --card: #f3f0e9; --accent: #9a6a12; --accent-bg: #f7eed9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15141a; --ink: #e9e6e0; --muted: #9a97a1; --line: #3d3b46;
      --panel: #1d1c23; --card: #262430; --accent: #e0a94a; --accent-bg: #2b2418;
    }
  }
  .bg { fill: var(--bg); }
  .box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .frame { fill: none; stroke: var(--accent); stroke-dasharray: 6 5; }
  .host { fill: var(--accent-bg); stroke: var(--accent); }
  .card { fill: var(--card); }
  .ghost { fill: var(--card); opacity: 0.4; }
  .dashed { stroke-dasharray: 5 4; }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
  text { fill: var(--ink); font-size: 13px; }
  .title { font-size: 20px; font-weight: 650; }
  .sub, .note { fill: var(--muted); font-size: 13px; }
  .section { fill: var(--accent); font-size: 12px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; }
  .frametag { fill: var(--accent); font-size: 13px; }
  .head { font-size: 14.5px; }
  .row { fill: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .strong { font-weight: 650; fill: var(--ink); }
  .was { fill: var(--muted); font-size: 11px; font-weight: 400; }
  .chip { fill: var(--accent); font-size: 11px; letter-spacing: 0.04em; }
  .edgelabel { fill: var(--muted); font-size: 11px; }
</style>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a97a1"/>
</marker></defs>
<rect class="bg" x="0" y="0" width="1240" height="968"/>
<text class="title" x="40" y="44">blits vocabulary — what contains what, and what reaches a subject</text>
<text class="sub" x="40" y="66">Names are the current picks, with the incumbent in parentheses. Generated from 2026-09-15-vocabulary.json.</text>
<rect class="box host" x="40" y="92" width="1160" height="46" rx="10"/>
<text class="head" x="62" y="122"><tspan class="strong">host</tspan> — owns the frame loop: syncs each mix once a frame, and holds every handle</text>
<rect class="box frame" x="40" y="166" width="1160" height="404" rx="10"/>
<text class="frametag" x="62" y="194">system — one complete area. klieg runs three: motion, effects, lighting</text>
<rect class="box panel" x="68" y="212" width="248" height="172" rx="10"/>
<text class="head" x="88" y="240"><tspan class="strong">rig</tspan> <tspan class="was">(table)</tspan></text>
<text class="row" x="88" y="262">what a subject can move on</text>
<text class="row" x="88" y="292"><tspan class="chip">channel</tspan> position · sum</text>
<text class="row" x="88" y="313"><tspan class="chip">channel</tspan> gain · mul</text>
<text class="row" x="88" y="334"><tspan class="chip">channel</tspan> color · last</text>
<text class="row" x="88" y="366"><tspan class="strong">rest</tspan> — nothing happening</text>
<rect class="box panel" x="68" y="400" width="248" height="72" rx="10"/>
<text class="head" x="88" y="428"><tspan class="strong">subject</tspan> <tspan class="was">(item)</tspan></text>
<text class="row" x="88" y="452">what is driven: a letter, a part</text>
<rect class="box panel" x="68" y="488" width="248" height="72" rx="10"/>
<text class="head" x="88" y="516"><tspan class="strong">signal</tspan> — from outside</text>
<text class="row" x="88" y="540">0 to 1, per subject, per frame</text>
<rect class="box panel" x="352" y="212" width="848" height="336" rx="10"/>
<text class="head" x="374" y="240"><tspan class="strong">mix</tspan> — every voice playing, over one rig</text>
<rect class="box ghost" x="396" y="268" width="392" height="180" rx="10"/>
<rect class="box ghost" x="388" y="260" width="392" height="180" rx="10"/>
<rect class="box card" x="380" y="252" width="392" height="180" rx="10"/>
<text class="head" x="400" y="280"><tspan class="strong">voice</tspan> <tspan class="was">(track)</tspan> — one patch, playing</text>
<text class="row" x="400" y="306"><tspan class="strong">patch</tspan>(t, subject, setting) → delta</text>
<text class="row" x="400" y="327">clock — start · rate · period ⇒ t</text>
<text class="row" x="400" y="348"><tspan class="strong">weight</tspan> — ramp(now), or a signal</text>
<text class="row" x="400" y="369">target — where it is heading</text>
<rect class="box card dashed" x="800" y="252" width="372" height="92" rx="10"/>
<text class="head" x="820" y="280"><tspan class="strong">group</tspan> — alternatives in time</text>
<text class="row" x="820" y="304">weights capped to sum to 1</text>
<text class="row" x="820" y="325">klieg's enter · active · exit</text>
<rect class="box card" x="800" y="360" width="372" height="94" rx="10"/>
<text class="head" x="820" y="388"><tspan class="strong">engine</tspan> — computes the fold</text>
<text class="row" x="820" y="412">one ships: the mixer; the seam is the interface</text>
<text class="row mono" x="820" y="436">engine(mix, now) = subject ↦ pose</text>
<rect class="box card" x="800" y="470" width="372" height="62" rx="10"/>
<text class="head" x="820" y="498"><tspan class="strong">handle</tspan> — the live controls</text>
<text class="row" x="820" y="520">start · rate · weight · seek · fade</text>
<path class="edge" d="M 316 276 H 372" marker-end="url(#tip)"/>
<text class="edgelabel" x="318" y="268">declares</text>
<path class="edge" d="M 316 432 H 372" marker-end="url(#tip)"/>
<text class="edgelabel" x="322" y="424">drives</text>
<path class="edge" d="M 316 524 L 372 470" marker-end="url(#tip)"/>
<text class="edgelabel" x="190" y="578">may be a weight</text>
<text class="section" x="40" y="620">One subject, one frame</text>
<rect class="box panel" x="68" y="636" width="300" height="108" rx="10"/>
<text class="head" x="88" y="664"><tspan class="strong">delta</tspan> <tspan class="was">(offset)</tspan> ⊂ rig</text>
<text class="row" x="88" y="688">what one patch says about</text>
<text class="row" x="88" y="709">one subject at one instant</text>
<rect class="box panel" x="440" y="636" width="300" height="108" rx="10"/>
<text class="head" x="460" y="664"><tspan class="strong">influence</tspan> <tspan class="was">(contribution)</tspan></text>
<text class="row" x="460" y="688">= weight ⊙ delta</text>
<text class="row" x="460" y="709">pulled toward rest by how</text>
<text class="row" x="460" y="730">much of the voice is on</text>
<rect class="box panel" x="816" y="636" width="384" height="108" rx="10"/>
<text class="head" x="836" y="664"><tspan class="strong">pose</tspan> <tspan class="was">(ResolvedOffset)</tspan></text>
<text class="row" x="836" y="688">= rest ⊕ Σ influence</text>
<text class="row" x="836" y="709">everything reaching that subject,</text>
<text class="row" x="836" y="730">folded by each channel's own rule</text>
<path class="edge" d="M 588 440 V 600 H 218 V 630" marker-end="url(#tip)"/>
<text class="edgelabel" x="600" y="480">returns one, per subject</text>
<path class="edge" d="M 368 690 H 434" marker-end="url(#tip)"/>
<text class="edgelabel" x="372" y="682">× weight</text>
<path class="edge" d="M 740 690 H 810" marker-end="url(#tip)"/>
<text class="edgelabel" x="768" y="682">Σ</text>
<text class="section" x="40" y="770">Where voices come from</text>
<rect class="box panel dashed" x="68" y="786" width="540" height="92" rx="10"/>
<text class="head" x="88" y="814"><tspan class="strong">source</tspan> — whatever decides one should exist</text>
<text class="row" x="88" y="838">a handler on an event, a chain handing over,</text>
<text class="row" x="88" y="859">cues and gets back a handle</text>
<rect class="box panel dashed" x="660" y="786" width="540" height="92" rx="10"/>
<text class="head" x="680" y="814"><tspan class="strong">score</tspan> — the source the app keeps</text>
<text class="row" x="680" y="838">the whole plan: timings and the cast</text>
<text class="row" x="680" y="859">blits never reads one; it only knows it is there</text>
<path class="edge" d="M 340 782 V 742" marker-end="url(#tip)"/>
<text class="edgelabel" x="348" y="762">cue</text>
<text class="note" x="40" y="906">A system declares one rig and one kind of subject; its mix runs voices over that rig; each voice is one patch with its own clock and weight.</text>
<text class="note" x="40" y="928">Nothing is computed until it is asked for: sample folds that subject's influences at the current reading, and an subject nobody asks about costs nothing.</text>
<text class="note" x="40" y="950">Two systems never share a mix, so a voice belongs to exactly one.</text>
</svg>
