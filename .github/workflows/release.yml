name: Release

# Publishes on a pushed tag, with no npm token anywhere: npm's trusted publishing swaps the
# workflow's OIDC token for a short-lived credential, which is why `id-token: write` is the one
# permission that matters here. A `v*` tag publishes the engine, `@msb235/blits`; a `quarks-v*` tag
# publishes the driver in `packages/quarks`, `@msb235/blits-quarks`, a `tone-v*` tag the one in
# `packages/tone`, `@msb235/blits-tone`, and a `panel-v*` tag the debugger in `packages/panel`,
# `@msb235/blits-panel`.
#
# npmjs.com holds the trust, per package: `npm trust github <name> --file release.yml --repo
# orochi235/blits --allow-publish` registers it, and `npm trust list <name>` shows it. npm refuses it
# (404) for a name that has never been published, so a package's first version goes out by hand.

on:
  push:
    tags: ['v*', 'quarks-v*', 'tone-v*', 'panel-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later, which is newer than the npm some Node lines
      # ship with. Upgrading is cheaper than pinning a Node version for a reason unrelated to Node.
      - run: npm install -g npm@latest

      - run: npm ci

      # Separately rather than through `npm run check`, so a failure names which one broke.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Which package this run publishes, from the tag; a run by hand publishes the engine.
      - name: Pick the package
        id: pick
        run: |
          case "$GITHUB_REF_NAME" in
            quarks-v*) echo "dir=packages/quarks" >> "$GITHUB_OUTPUT"
                       echo "version=${GITHUB_REF_NAME#quarks-v}" >> "$GITHUB_OUTPUT" ;;
            tone-v*)   echo "dir=packages/tone" >> "$GITHUB_OUTPUT"
                       echo "version=${GITHUB_REF_NAME#tone-v}" >> "$GITHUB_OUTPUT" ;;
            panel-v*)  echo "dir=packages/panel" >> "$GITHUB_OUTPUT"
                       echo "version=${GITHUB_REF_NAME#panel-v}" >> "$GITHUB_OUTPUT" ;;
            *)         echo "dir=." >> "$GITHUB_OUTPUT"
                       echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT" ;;
          esac

      # A tag that disagrees with the manifest publishes a version nobody asked for, under a name
      # git will keep pointing somewhere else. Cheaper to stop here than to unpublish.
      - name: The tag has to be the version being published
        if: github.ref_type == 'tag'
        working-directory: ${{ steps.pick.outputs.dir }}
        run: |
          manifest="$(node -p 'require("./package.json").version')"
          if [ "${{ steps.pick.outputs.version }}" != "$manifest" ]; then
            echo "tag says ${{ steps.pick.outputs.version }}, package.json says $manifest" >&2
            exit 1
          fi

      - name: The changelog has a section for this version
        working-directory: ${{ steps.pick.outputs.dir }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi

      # A driver's tests run against the engine's source in this tree, so its dev dependency has to
      # name that version, or the release would pass against different code than the pin says.
      - name: The driver was tested against this tree's engine
        if: steps.pick.outputs.dir != '.'
        run: |
          pin="$(node -p 'require("./${{ steps.pick.outputs.dir }}/package.json").devDependencies["@msb235/blits"]')"
          engine="$(node -p 'require("./package.json").version')"
          if [ "$pin" != "$engine" ]; then
            echo "the driver tests against @msb235/blits $pin, but this tree's engine is $engine" >&2
            exit 1
          fi

      # The host installs the engine as a peer; a range that leaves out the engine just tested, or
      # one npm cannot serve, would publish a broken install.
      - name: The driver's peer range takes that engine, from npm
        if: steps.pick.outputs.dir != '.'
        run: |
          range="$(node -p 'require("./${{ steps.pick.outputs.dir }}/package.json").peerDependencies["@msb235/blits"]')"
          engine="$(node -p 'require("./package.json").version')"
          if ! npm view "@msb235/blits@$range" version | grep -q "'$engine'\|^$engine\$"; then
            echo "the driver's peer range $range does not take @msb235/blits $engine from npm" >&2
            exit 1
          fi

      # `workspaces` only wires up the site and the drivers for development. npm publishes
      # package.json as it stands, so the field has to come off this throwaway checkout before packing.
      - name: Drop the workspaces from the engine's published manifest
        if: steps.pick.outputs.dir == '.'
        run: npm pkg delete workspaces

      - name: Publish the engine
        if: steps.pick.outputs.dir == '.'
        run: npm publish

      - name: Publish the driver
        if: steps.pick.outputs.dir != '.'
        run: npm publish -w ./${{ steps.pick.outputs.dir }}
